#!/usr/bin/env -S stimela run

_include:
  - solarkat-cabs.yaml

opts:
  log:
    dir: logs/log-{config.run.datetime}
    name: log-{info.fqname}
    nest: 2 
    symlink: log
  backend:
    select: singularity

solarkat:
  name: solarkat recipe
  info: 'Recipe to image and subtract the Sun from a MeerKAT observation'

  assign:
    image-prefix: '{recipe.dir_out}/im{info.suffix}/im{info.suffix}{recipe.suffix}'
    mask-prefix: '{recipe.dir_out}/im{info.suffix}/mask{info.suffix}{recipe.suffix}'          

  assign_based_on:
    _include: solarkat-observation-sets.yaml

  inputs:
    obs:
      info: "Selects observation by label, -- edit solarkat-observation-sets.yml"
      required: true
    suffix:
      dtype: str
      default: ''
    ms:
      dtype: MS
    splitted_ms_suffix:
      dtype: str
      default: '_scan_'
  outputs:
    dir_out:
      dtype: Directory
      mkdir: true
    perscan_dir_out:
      dtype: Directory
      mkdir: true
      default: "{current.dir_out}/ms_scans"
    temp_dir:
      dtype: Directory
      default: "{current.dir_out}/tmp"
      mkdir: true
    dirty_image_sun_dir:
      dtype: Directory
      default: "{current.dir_out}/dirty_sun_img"
      mkdir: true
    regions_dir_out:
      dtype: Directory
      default: "{current.dir_out}/region_files"
      mkdir: true
    masks_dir_out:
      dtype: Directory
      default: "{current.dir_out}/sun_masks"
      mkdir: true
    qcal_dir_out:
      dtype: Directory
      default: "{current.dir_out}/quartical"
      mkdir: true
    qcal_gain_dir_out:
      dtype: Directory
      default: "{current.qcal_dir_out}/peel_gains.qc"
      mkdir: true
    clean_image_sun_dir:
      dtype: str
      default: "{current.dir_out}/clean_sun_img"
      mkdir: true

  steps:

    # image-3: 
    #   info: "Deconvolve CORRECTED_DATA"
    #   cab: wsclean
    #   params:
    #     abs-mem: 110
    #     j: 8
    #     deconvolution-threads: 8
    #     ms: =recipe.ms
    #     prefix: '{recipe.image-prefix}'
    #     scale: 1.1asec
    #     parallel-reordering: 8
    #     use-wgridder: true
    #     parallel-deconvolution: 2560
    #     padding: 2.0
    #     niter: 110000
    #     size: 10240 
    #     nchan: 8
    #     column: CORRECTED_DATA
    #     auto-threshold: =UNSET
    #     threshold: 3e-6
    #     mgain: 0.9
    #     weight: 'briggs -0.3'
    #     multiscale: true
    #     multiscale-scales: [0,2,4,8]
    #     join-channels: true
    #     fit-spectral-pol: 4 
    #     temp-dir: =recipe.dirs.temp
    #     fits-mask: "combomaskfilled2.fits"



#     backup-original-model-data:
#       info: 'Rename the MODEL_DATA visibilities to ORIGINAL_MODEL_DATA (to backup the original MODEL_DATA column)'
#       cab: rename_model_data
# #      skip: false
#       params:
#         ms: =recipe.ms
#         oldname: 'MODEL_DATA'
#         newname: 'MODEL_DATA_ORIGINAL' 
    
    get-scans-info: 
      info: 'Get information the scans in the input MS, including the RA and Dec of the Sun'
      cab: get_scans_info
      params:
        ms: =recipe.ms
        output_file: '{recipe.dir_out}/scans-info.txt'

    read-scans-info:
      info: 'Read the scans-info file and return its contents as a list of tuples'
      cab: read_scans_info
      params:
        input_file: '{recipe.dir_out}/scans-info.txt'

    split-ms-by-scan: 
      info: 'Split the master MS into per-scan Measurement Selects'
      params:
        scans_info: =steps.read-scans-info.scans_info
        ms: '{recipe.ms}'
        dir_out: =recipe.perscan_dir_out
      recipe:
        inputs:
          scans_info:
            dtype: List[Tuple[str,str,str,str,str,str]]
          ms:
            dtype: MS
          dir_out:
            dtype: Directory
        for_loop:
          var: current_scan
          over: scans_info
        steps:     
          casa_split_scan:
            cab: splitms_scan
            params:
              vis: '{root.ms}'
              datacolumn: 'all'
              scan: =GETITEM(recipe.current_scan,1)
              outputvis: ='{recipe.dir_out}/'+GETITEM(recipe.current_scan,0)

    run-chgcentre-to-sun-loop:
      info: "Rotate the phase centre of the per-scan Measurement Sets to the Sun"
      recipe: chgcentre-to-sun-loop
      params:
        scans_info: =steps.read-scans-info.scans_info
        # dir_out: =recipe.dir_out
        perscan_dir_out: =recipe.perscan_dir_out
     
    run-dirty-image-sun-loop:
      info: "Create dirty images of the Sun for each per-scan MS"
      recipe: dirty-image-sun-loop
      params:
        scans_info: =steps.read-scans-info.scans_info
        # dir_out: =recipe.dir_out
        perscan_dir_out: =recipe.perscan_dir_out
        dirty_image_sun_dir: =recipe.dirty_image_sun_dir
        temp_dir: =recipe.temp_dir

    create-ds9-regions:
      info: "Create a DS9 regions encompassing the solar disk for each scan"
      cab: create_ds9_regions
      params:
        input_file: '{recipe.dir_out}/scans-info.txt'
        output_dir: =recipe.dirty_image_sun_dir

    create-solar-masks:
      info: "Make FITS masks that encompass the solar disk from the dirty image templates and DS9 regions"
      recipe: make-solar-mask-loop
      params:
        scans_info: =steps.read-scans-info.scans_info
        dirty_image_sun_dir: =recipe.dirty_image_sun_dir

    run-clean-image-sun-loop:
      info: "Create deconvolved images of the Sun for each per-scan MS"
      recipe: clean-image-sun-loop
      params:
        scans_info: =steps.read-scans-info.scans_info
        # dir_out: =recipe.dir_out
        perscan_dir_out: =recipe.perscan_dir_out
        dirty_image_sun_dir: =recipe.dirty_image_sun_dir
        clean_image_sun_dir: =recipe.clean_image_sun_dir
        temp_dir: =recipe.temp_dir

    run-predict-solar-model-loop:
      info: "Degrid the multiscale solar clean component model into the MODEL_DATA column of the per-scan Measurement Sets"
      recipe: predict-solar-model-loop
      params:
        scans_info: =steps.read-scans-info.scans_info
        perscan_dir_out: =recipe.perscan_dir_out
        clean_image_sun_dir: =recipe.clean_image_sun_dir
        temp_dir: =recipe.temp_dir

    run-chgcentre-revert-loop:
      info: "Rotate the phase centres of the per-scan Measurement Sets back to their original positions"
      recipe: chgcentre-revert-loop
      params:
        scans_info: =steps.read-scans-info.scans_info
        # dir_out: =recipe.dir_out
        perscan_dir_out: =recipe.perscan_dir_out

    add-sun-model-data-column:
      info: "Add a MODEL_DATA_SUN column to the original MS"
      cab: add_column_to_ms
      params:
        ms:  =recipe.ms
        colnames: ['MODEL_DATA_SUN']
        likecol: 'DATA'

    copy-solar-model:
      info: "Copy model solar visibilties from per-scan Measurement Sets into the MODEL_DATA_SUN column of the original MS"
      cab: copy_solar_model
      params:
        ms: =recipe.ms
        scans_info: =steps.read-scans-info.scans_info
        perscan_dir_out: =recipe.perscan_dir_out
        copycol: 'MODEL_DATA'
        tocol: 'MODEL_DATA_SUN'
        rowchunk: 200000

    peel-sun:
      info: 'Perform delay self-calibration and solar peeling on the input MS'
      cab: quartical
      params:
        input_ms.path: '{recipe.ms}'
        input_ms.data_column: CORRECTED_DATA
        input_ms.weight_column: WEIGHT_SPECTRUM
        input_ms.time_chunk: '14'
        input_ms.freq_chunk: '0'
        input_ms.select_uv_range: [0,0]
        input_ms.group_by: [FIELD_ID,DATA_DESC_ID,SCAN_NUMBER]
        input_model.recipe: MODEL_DATA_ORIGINAL:MODEL_DATA_SUN
        input_model.apply_p_jones: false
        input_ms.is_bda: False
        solver.terms: [K,dE]
        solver.iter_recipe: [100,50]
        solver.propagate_flags: false
        solver.robust: false 
        solver.threads: 4
        dask.threads: 8
        output.gain_directory: '{recipe.qcal_gain_dir_out}'
        output.log_directory: '{recipe.qcal_dir_out}'
        output.overwrite: true
        output.products: [corrected_residual]
        output.columns: [CORRECTED_RESIDUAL]
        output.subtract_directions: [1]
        output.flags: true 
        output.apply_p_jones_inv: false
        mad_flags.enable: false
        dask.scheduler: threads
        K.type: phase
        K.direction_dependent: false
        K.time_interval: 4
        K.freq_interval: 0
        K.initial_estimate: true
        dE.type: complex
        dE.time_interval: 14
        dE.freq_interval: 64
        dE.initial_estimate: False
        dE.direction_dependent: true
        dE.pinned_directions: [0]

    # save-flags-5:
    #   cab: casa.flagman
    #   params:
    #     ms: =recipe.ms
    #     versionname: "After-3GC.yml"
    #     mode: save

    image-7:
      info: "Deconvolve the improved image"
      cab: wsclean
      params:
        abs-mem: 110
        j: 8
        deconvolution-threads: 8
        ms: =recipe.ms
        prefix: '{recipe.image-prefix}-final'
        scale: 1.1asec
        parallel-reordering: 8
        use-wgridder: true
        parallel-deconvolution: 2560
        padding: 2.0
        niter: 110000
        size: 10240 
        nchan: 8
        column: CORRECTED_RESIDUAL
        auto-threshold: =UNSET
        threshold: 3e-6
        mgain: 0.9
        weight: 'briggs -0.3'
        multiscale: true
        multiscale-scales: [0,2,4,8]
        join-channels: true
        fit-spectral-pol: 4 
        temp-dir: =recipe.dirs.temp
        # Note that fits-mask is non-standard for general operation, just my NGC4410 test case
        # This is a general question, of how to handle the case where the user supplies
        # already self-calibrated data, not just 1GC-calibrated (separate recipe again?)
        fits-mask: "combomaskfilled2.fits"


